{n:1,ar:”[m]بِسْمِ ٱللَّهِ[/m] [g]ٱلرَّحْمَٰنِ[/g] ٱلرَّحِيمِ”,fr:“Au nom d’Allah, le Tout Miséricordieux, le Très Miséricordieux.”,tf:“La Basmala inaugure chaque sourate sauf At-Tawba. Ar-Rahman désigne la miséricorde universelle, Ar-Rahim la miséricorde particulière aux croyants dans l’au-delà.”},
{n:2,ar:”[m]ٱلْحَمْدُ لِلَّهِ[/m] رَبِّ [g]ٱلْعَٰلَمِينَ[/g]”,fr:“Louange à Allah, Seigneur de l’univers,”,tf:“Al-Hamd appartient à Allah seul. Rabb al-‘Alamin : Il est le Créateur et Dispensateur de bienfaits à toutes les créatures.”},
{n:3,ar:”[g]ٱلرَّحْمَٰنِ[/g] ٱلرَّحِيمِ”,fr:“le Tout Miséricordieux, le Très Miséricordieux,”,tf:“Répétition pour insister sur la miséricorde — attribut fondamental d’Allah. Ar-Rahman couvre toutes les créatures en ce monde ; Ar-Rahim est pour les croyants au Jour du Jugement.”},

{n:5,ar:“إِيَّاكَ [g]نَعْبُدُ[/g] وَإِيَّاكَ [g]نَسْتَعِينُ[/g]”,fr:“C’est Toi [Seul] que nous adorons, et c’est Toi [Seul] dont nous implorons le secours.”,tf:“Cœur de la sourate et de l’islam : adoration exclusive d’Allah et recours exclusif à Lui. Le passage du ‘Il’ au ‘Toi’ marque l’entrée dans Sa présence lors de la prière.”},
{n:6,ar:”[m]ٱهْدِنَا[/m] ٱلصِّرَٰطَ [r]ٱلْمُسْتَقِيمَ[/r]”,fr:“Guide-nous dans le droit chemin,”,tf:“Supplication répétée 17 fois/jour dans la prière. Le chemin droit = l’islam dans sa totalité : croyance, actes et conduite vertueuse.”},
{n:7,ar:“صِرَٰطَ [g]ٱلَّذِينَ[/g] أَنْعَمْتَ عَلَيْهِمْ [r]غَيْرِ[/r] ٱلْمَغْضُوبِ عَلَيْهِمْ وَلَا [q]ٱلضَّآلِّينَ[/q]”,fr:“le chemin de ceux que Tu as comblés de faveurs, non pas de ceux qui ont encouru Ta colère, ni des égarés.”,tf:“Comblés de faveurs : prophètes, véridiques, martyrs et vertueux. Colère : ceux qui connaissent la vérité et la rejettent. Égarés : ceux qui adorent sans méthode correcte.”},

{n:1,ar:“إِنَّ[m]ٓا[/m] أَنزَلْنَٰهُ فِى لَيْلَةِ [r]ٱلْقَدْرِ[/r]”,fr:“Nous l’avons certes révélé pendant la nuit d’Al-Qadr.”,tf:“Le Coran fut descendu en totalité la nuit d’Al-Qadr puis révélé progressivement au Prophète ﷺ sur 23 ans. Cette nuit se situe dans les dix dernières nuits de Ramadan.”},
{n:2,ar:“وَمَ[m]آ[/m] أَدْرَاكَ مَا لَيْلَةُ [r]ٱلْقَدْرِ[/r]”,fr:“Et qui te dira ce qu’est la nuit d’Al-Qadr?”,tf:“Question rhétorique pour magnifier l’importance de cette nuit — sa valeur dépasse toute compréhension ordinaire.”},
{n:3,ar:“لَيْلَةُ [r]ٱلْقَدْرِ[/r] خَيْرٌ [g]مِّنْ[/g] أَلْفِ شَهْرٍ”,fr:“La nuit d’Al-Qadr est meilleure que mille mois.”,tf:“Mille mois ≈ 83 ans, une vie entière. L’adoration de cette nuit vaut plus qu’une vie d’adoration — miséricorde immense d’Allah.”},
{n:4,ar:“تَنَزَّلُ [g]ٱلْمَلَٰٓئِكَةُ[/g] وَ[r]ٱلرُّوحُ[/r] فِيهَا بِإِذْنِ رَبِّهِم [g]مِّن[/g] كُلِّ أَمْرٍ”,fr:“Les Anges ainsi que l’Esprit descendent durant cette nuit, avec la permission de leur Seigneur pour tout ordre.”,tf:“Jibrîl et les anges descendent en masse portant les décrets divins pour l’année à venir.”},
{n:5,ar:“سَلَٰمٌ هِىَ حَتَّىٰ مَطْلَعِ [r]ٱلْفَجْرِ[/r]”,fr:“Elle est paix et salut jusqu’à l’apparition de l’aube.”,tf:“Toute la nuit est paix et bénédiction. Les démons sont enchaînés, les anges présents, la paix spirituelle est profonde.”},

98:[
{n:1,ar:“لَمْ يَكُنِ [r]ٱلَّذِينَ[/r] كَفَرُوا۟ [g]مِنْ[/g] أَهْلِ [m]ٱلْكِتَٰبِ[/m] وَٱلْمُشْرِكِينَ [g]مُنفَكِّينَ[/g] حَتَّىٰ تَأْتِيَهُمُ [r]ٱلْبَيِّنَةُ[/r]”,fr:“Les mécréants parmi les gens du Livre et les associateurs n’auraient pas abandonné leur mécréance jusqu’à ce que leur vînt la preuve manifeste,”,tf:“Les gens du Livre et les polythéistes arabes persistaient dans leur égarement. La preuve allait être le Prophète ﷺ et le Coran.”},
{n:2,ar:“رَسُولٌ [g]مِّنَ[/g] ٱللَّهِ يَتْلُوا۟ صُحُفًا [t]مُّطَهَّرَةً[/t]”,fr:“un Messager d’Allah, qui récite des pages purifiées,”,tf:“Muhammad ﷺ récitant les feuillets du Coran — purifiés de tout mensonge, contradiction et altération.”},
{n:3,ar:“فِيهَا كُتُبٌ [q]قَيِّمَةٌ[/q]”,fr:“contenant des écrits droits.”,tf:”‘Qayyima’ : droits, justes, immuables, valables pour tous les temps et tous les peuples.”},
{n:4,ar:“وَمَا تَفَرَّقَ [r]ٱلَّذِينَ[/r] أُوتُوا۟ [m]ٱلْكِتَٰبَ[/m] إِلَّا [g]مِنۢ[/g] بَعْدِ مَا جَآءَتْهُمُ [r]ٱلْبَيِّنَةُ[/r]”,fr:“Ceux à qui le Livre a été donné ne se sont divisés qu’après que leur fut venue la preuve manifeste.”,tf:“Paradoxe : la division est venue après la preuve, non par ignorance, mais par jalousie et intérêts mondains.”},
{n:5,ar:“وَمَ[m]آ[/m] أُمِرُوٓا۟ إِلَّا لِيَعْبُدُوا۟ ٱللَّهَ [g]مُخْلِصِينَ[/g] لَهُ [r]ٱلدِّينَ[/r] حُنَفَآءَ وَيُقِيمُوا۟ [m]ٱلصَّلَوٰةَ[/m] وَيُؤْتُوا۟ [m]ٱلزَّكَوٰةَ[/m] وَذَٰلِكَ دِينُ [r]ٱلْقَيِّمَةِ[/r]”,fr:“Ils n’avaient été commandés que d’adorer Allah sincèrement, d’accomplir la Salat et d’acquitter la Zakat. C’est là la religion droite.”,tf:“L’essence de tous les messages : tawhid, prière, zakat. Le ‘din al-qayyima’ — religion immuable valable pour tous les prophètes.”},
{n:6,ar:“إِنَّ [r]ٱلَّذِينَ[/r] كَفَرُوا۟ [g]مِنْ[/g] أَهْلِ [m]ٱلْكِتَٰبِ[/m] وَٱلْمُشْرِكِينَ فِى [g]نَارِ[/g] جَهَنَّمَ خَٰلِدِينَ فِيهَا أُو۟لَٰٓئِكَ هُمْ شَرُّ [r]ٱلْبَرِيَّةِ[/r]”,fr:“Ceux qui ont mécru parmi les gens du Livre et les associateurs seront dans le feu de la Géhenne éternellement. Ils sont les pires des créatures.”,tf:“Verdict pour ceux qui ont reçu la preuve et l’ont rejetée sciemment. La gravité du rejet délibéré de la vérité.”},
{n:7,ar:“إِنَّ [r]ٱلَّذِينَ[/r] ءَامَنُوا۟ وَعَمِلُوا۟ [m]ٱلصَّٰلِحَٰتِ[/m] أُو۟لَٰٓئِكَ هُمْ خَيْرُ [r]ٱلْبَرِيَّةِ[/r]”,fr:“Ceux qui ont cru et accompli de bonnes œuvres sont les meilleures des créatures.”,tf:“Contraste parfait. ‘Khayr al-bariyya’ — les meilleures créatures, supérieures même aux anges selon certains savants.”},
{n:8,ar:“جَزَآؤُهُمْ عِندَ رَبِّهِمْ جَنَّٰتُ عَدْنٍ تَجْرِى [g]مِن[/g] تَحْتِهَا [m]ٱلْأَنْهَٰرُ[/m] خَٰلِدِينَ فِيهَآ أَبَدًا رَّضِىَ ٱللَّهُ عَنْهُمْ وَرَضُوا۟ عَنْهُ ذَٰلِكَ لِمَنْ خَشِىَ [r]رَبَّهُۥ[/r]”,fr:“Leur récompense sera les jardins d’Eden sous lesquels coulent les ruisseaux. Allah est satisfait d’eux et ils sont satisfaits de Lui. C’est pour celui qui craint son Seigneur.”,tf:“Le summum du paradis : le ridha — satisfaction mutuelle entre Allah et Ses serviteurs. Réservé à ceux qui ont la taqwa.”},
],
99:[
{n:1,ar:“إِذَا [r]زُلْزِلَتِ[/r] ٱلْأَرْضُ [q]زِلْزَالَهَا[/q]”,fr:“Quand la terre sera secouée d’un violent tremblement,”,tf:“Le tremblement final de la Terre au Jour du Jugement — une convulsion planétaire sans précédent dans l’histoire humaine.”},
{n:2,ar:“وَأَخْرَجَتِ [r]ٱلْأَرْضُ[/r] أَثْقَالَهَا”,fr:“et que la terre aura sorti ses fardeaux,”,tf:“La terre vomira tout : les morts ressusciteront, les trésors et secrets seront mis au jour.”},
{n:3,ar:“وَقَالَ [r]ٱلْإِنسَٰنُ[/r] مَا لَهَا”,fr:“et que l’homme dira : «Qu’a-t-elle?»”,tf:“L’homme stupéfait demande ce qui se passe — incapable de comprendre l’ampleur de ce Jour terrible.”},
{n:4,ar:“يَوْمَئِذٍ تُحَدِّثُ [m]أَخْبَارَهَا[/m]”,fr:“Ce jour-là, elle racontera ses nouvelles,”,tf:“La terre témoignera de tout ce qui s’est passé sur elle. Le Prophète ﷺ : ‘Elle témoignera contre chaque homme et femme de ce qu’ils ont fait sur elle.’”},
{n:5,ar:“بِأَنَّ رَبَّكَ أَوْحَىٰ لَهَا”,fr:“parce que ton Seigneur lui aura inspiré cela.”,tf:“Allah inspirera à la terre sa mission de témoignage — toute la création obéit à Lui.”},
{n:6,ar:“يَوْمَئِذٍ يَصْدُرُ [r]ٱلنَّاسُ[/r] أَشْتَاتًا [g]لِّيُرَوْا۟[/g] أَعْمَٰلَهُمْ”,fr:“Ce jour-là, les hommes sortiront en groupes séparés pour qu’on leur montre leurs œuvres.”,tf:“Groupes distincts selon leurs actes et destins. Chacun confronté à l’intégralité de ses actions.”},
{n:7,ar:“فَمَن يَعْمَلْ [g]مِثْقَالَ[/g] ذَرَّةٍ خَيْرًا يَرَهُۥ”,fr:“Quiconque a fait le poids d’un atome de bien le verra,”,tf:“Justice absolue : même le bien le plus infime sera vu et récompensé. Aucun acte vertueux n’est trop petit pour Allah.”},
{n:8,ar:“وَمَن يَعْمَلْ [g]مِثْقَالَ[/g] ذَرَّةٍ شَرًّا يَرَهُۥ”,fr:“et quiconque a fait le poids d’un atome de mal le verra.”,tf:“Symétrie parfaite. Ibn Masoud : ‘Verset le plus équitable du Coran.’ Rien n’échappe à la justice divine.”},
],
100:[
{n:1,ar:“وَ[r]ٱلْعَٰدِيَٰتِ[/r] ضَبْحًا”,fr:“Par les coursiers haletants,”,tf:“Serment par les chevaux de guerre — symbole de vaillance et d’effort dans la cause d’Allah.”},
{n:2,ar:“فَ[q]ٱلْمُورِيَٰتِ[/q] قَدْحًا”,fr:“qui font jaillir des étincelles de leurs sabots,”,tf:“Les sabots frappant les pierres — image de puissance et de rapidité.”},
{n:3,ar:“فَ[r]ٱلْمُغِيرَٰتِ[/r] صُبْحًا”,fr:“qui font des raids à l’aube,”,tf:“Les raids à l’aube — moment de vigilance, courage et action décisive.”},
{n:4,ar:“فَأَثَرْنَ بِهِۦ [g]نَقْعًا[/g]”,fr:“et soulèvent des nuages de poussière,”,tf:“Poussière soulevée au galop — image vivante du mouvement vers la cause divine.”},
{n:5,ar:“فَوَسَطْنَ بِهِۦ [r]جَمْعًا[/r]”,fr:“et s’élancent au milieu de l’ennemi groupé.”,tf:“Pénétrant au cœur des rangs ennemis — point culminant du tableau de bravoure.”},
{n:6,ar:“إِنَّ [r]ٱلْإِنسَٰنَ[/r] لِرَبِّهِۦ لَكَنُودٌ”,fr:“L’homme est vraiment ingrat envers son Seigneur,”,tf:“Conclusion : l’homme emploie sa force en oubliant Celui qui la lui a donnée. Ingratitude fondamentale.”},
{n:7,ar:“وَإِنَّهُۥ عَلَىٰ ذَٰلِكَ لَشَهِيدٌ”,fr:“et il en est lui-même témoin.”,tf:“L’homme est son propre témoin de son ingratitude — sa conscience le sait.”},
{n:8,ar:“وَإِنَّهُۥ لِحُبِّ [r]ٱلْخَيْرِ[/r] لَشَدِيدٌ”,fr:“Et il est passionnément attaché aux biens de ce monde.”,tf:“Amour excessif des richesses — racine de l’ingratitude envers Allah.”},
{n:9,ar:“أَفَلَا يَعْلَمُ إِذَا بُعْثِرَ مَا فِى [r]ٱلْقُبُورِ[/r]”,fr:“Ne sait-il pas que lorsque ce qui est dans les tombes sera bouleversé,”,tf:“Rappel de la résurrection — comment s’attacher au monde sachant qu’on ressuscitera pour être jugé?”},
{n:10,ar:“وَحُصِّلَ مَا فِى [r]ٱلصُّدُورِ[/r]”,fr:“et que ce qui est dans les poitrines sera rendu apparent,”,tf:“Les secrets du cœur — intentions, croyances cachées — seront tous révélés.”},
{n:11,ar:“إِنَّ رَبَّهُم بِهِمْ يَوْمَئِذٍ لَّخَبِيرٌ”,fr:“leur Seigneur ce Jour-là est parfaitement informé de ce qu’ils ont fait.”,tf:“Allah est Al-Khabir — rien ne Lui échappe. Invitation à la vigilance et la sincérité.”},
],
101:[
{n:1,ar:”[r]ٱلْقَارِعَةُ[/r]”,fr:“La Fracassante!”,tf:“Nom du Jour du Jugement — le bruit fracassant cosmique. Ce nom seul suffit à éveiller la vigilance.”},
{n:2,ar:“مَا [r]ٱلْقَارِعَةُ[/r]”,fr:“Qu’est-ce que la Fracassante?”,tf:“Style d’amplification : la réponse normale est insuffisante pour décrire cet événement.”},
{n:3,ar:“وَمَآ أَدْرَاكَ مَا [r]ٱلْقَارِعَةُ[/r]”,fr:“Et qui te dira ce qu’est la Fracassante?”,tf:“Même le Prophète ﷺ ne peut en avoir une image complète sans révélation.”},
{n:4,ar:“يَوْمَ يَكُونُ [r]ٱلنَّاسُ[/r] كَ[g]ٱلْفَرَاشِ[/g] [r]ٱلْمَبْثُوثِ[/r]”,fr:“Le Jour où les hommes seront comme des papillons éparpillés,”,tf:“Humains comme papillons affolés — désorientés, apeurés, chaos absolu de la résurrection.”},
{n:5,ar:“وَتَكُونُ [r]ٱلْجِبَالُ[/r] كَ[r]ٱلْعِهْنِ[/r] [r]ٱلْمَنفُوشِ[/r]”,fr:“et les montagnes comme de la laine cardée.”,tf:“Montagnes symboles de stabilité réduites à de la laine — si elles tombent, qu’en est-il des constructions humaines?”},
{n:6,ar:“فَأَمَّا [g]مَن[/g] ثَقُلَتْ [g]مَوَٰزِينُهُۥ[/g]”,fr:“Quant à celui dont la balance sera lourde,”,tf:“La balance est réelle. Bonnes actions l’emportant = destin heureux. Justice divine absolue.”},
{n:7,ar:“فَهُوَ فِى عِيشَةٍ [r]رَّاضِيَةٍ[/r]”,fr:“il jouira d’une vie agréable.”,tf:”‘Îsha radhiya’ — vie parfaite au paradis, sans aucune insatisfaction.”},
{n:8,ar:“وَأَمَّا [g]مَنْ[/g] خَفَّتْ [g]مَوَٰزِينُهُۥ[/g]”,fr:“Mais quant à celui dont la balance sera légère,”,tf:“Mauvaises actions l’emportant — sort terrible.”},
{n:9,ar:“فَأُمُّهُۥ هَاوِيَةٌ”,fr:“son refuge sera l’Abîme.”,tf:”‘Hawiya’ — l’abîme. Comme un enfant se réfugie chez sa mère, cet homme aura l’enfer pour ‘mère’.”},
{n:10,ar:“وَمَآ أَدْرَاكَ مَا هِيَهْ”,fr:“Et qui te dira ce que c’est?”,tf:“La Hawiya dépasse toute imagination humaine.”},
{n:11,ar:”[q]نَارٌ[/q] حَامِيَةٌ”,fr:“C’est un feu ardent!”,tf:“Feu d’une intensité incomparable à tout feu de ce monde.”},
],
102:[
{n:1,ar:“أَلْهَاكُمُ [r]ٱلتَّكَاثُرُ[/r]”,fr:“La course aux richesses vous a distraits,”,tf:”‘Al-takathur’ : compétition pour accumuler toujours plus — richesses, enfants, prestige. Détourne de l’au-delà.”},
{n:2,ar:“حَتَّىٰ زُرْتُمُ [r]ٱلْمَقَابِرَ[/r]”,fr:“jusqu’à ce que vous visitiez les tombeaux.”,tf:“Seule la mort met fin à cette course — certains comptaient même leurs morts pour se vanter.”},
{n:3,ar:“كَلَّا سَوْفَ تَعْلَمُونَ”,fr:“Non! Vous saurez bientôt!”,tf:”‘Kalla’ — réprimande forte. À la mort vous comprendrez que cette course était une distraction fatale.”},
{n:4,ar:“ثُمَّ كَلَّا سَوْفَ تَعْلَمُونَ”,fr:“Non, vraiment! Vous saurez bientôt!”,tf:“Répétition pour amplifier — d’abord dans la tombe, puis au Jour de la Résurrection.”},
{n:5,ar:“كَلَّا لَوْ تَعْلَمُونَ عِلْمَ [r]ٱلْيَقِينِ[/r]”,fr:“Non! Si vous saviez avec une science certaine!”,tf:“Si vous connaissiez l’au-delà avec certitude, vous abandonneriez immédiatement cette course inutile.”},
{n:6,ar:“لَتَرَوُنَّ [r]ٱلْجَحِيمَ[/r]”,fr:“Vous verrez sûrement la Fournaise!”,tf:“Certitude : vous verrez l’enfer — soit pour le traverser rapidement, soit pour y demeurer.”},
{n:7,ar:“ثُمَّ لَتَرَوُنَّهَا عَيْنَ [r]ٱلْيَقِينِ[/r]”,fr:“Puis vous la verrez avec l’œil de la certitude.”,tf:”‘Ayn al-yaqin’ — certitude par la vue directe. Vous ne l’imaginerez plus, vous la verrez.”},
{n:8,ar:“ثُمَّ لَتُسْـَٔلُنَّ يَوْمَئِذٍ عَنِ [r]ٱلنَّعِيمِ[/r]”,fr:“Puis, ce jour-là, vous serez interrogés sur les bienfaits reçus.”,tf:“Chaque bienfait — santé, nourriture, temps, sécurité — fera l’objet d’une question. Le Prophète ﷺ : parmi les premiers, la santé et l’eau fraîche.”},
],
103:[
{n:1,ar:“وَ[r]ٱلْعَصْرِ[/r]”,fr:“Par le Temps!”,tf:“Serment par le temps — l’une des plus grandes faveurs d’Allah, dont l’homme est le plus négligent.”},
{n:2,ar:“إِنَّ [r]ٱلْإِنسَٰنَ[/r] لَفِى خُسْرٍ”,fr:“L’être humain est certes en perdition,”,tf:“Verdict général : tout homme dilapide le capital de sa vie sans le rentabiliser pour l’au-delà.”},
{n:3,ar:“إِلَّا [r]ٱلَّذِينَ[/r] ءَامَنُوا۟ وَعَمِلُوا۟ [m]ٱلصَّٰلِحَٰتِ[/m] وَتَوَاصَوْا۟ بِ[r]ٱلْحَقِّ[/r] وَتَوَاصَوْا۟ بِ[r]ٱلصَّبْرِ[/r]”,fr:“sauf ceux qui ont la foi, font de bonnes œuvres, s’enjoignent mutuellement la vérité et s’enjoignent mutuellement l’endurance.”,tf:“4 conditions : foi, bonnes œuvres, s’enjoindre la vérité, s’enjoindre la patience. Ash-Shafi’i : ‘Si Allah n’avait révélé que cette sourate, elle aurait suffi à guider l’humanité.’”},
],
104:[
{n:1,ar:“وَيْلٌ لِّكُلِّ هُمَزَةٍ [r]لُّمَزَةٍ[/r]”,fr:“Malheur à tout diffamateur et calomniateur,”,tf:”‘Humazah’ : blesse par gestes et regard. ‘Lumazah’ : blesse par paroles et moqueries. Comportements destructeurs condamnés fermement.”},
{n:2,ar:”[r]ٱلَّذِى[/r] جَمَعَ [g]مَالًا[/g] وَعَدَّدَهُ”,fr:“qui amasse des richesses et les compte sans cesse,”,tf:“Obsession d’accumuler et de compter — attachement maladif au monde, oubli de la finalité spirituelle.”},
{n:3,ar:“يَحْسَبُ أَنَّ [g]مَالَهُۥ[/g] أَخْلَدَهُۥٓ”,fr:“croyant que sa fortune le rendra immortel!”,tf:“L’illusion suprême : croire que la richesse protège de la mort. Il se comporte comme s’il vivrait éternellement.”},
{n:4,ar:“كَلَّا لَيُنۢبَذَنَّ فِى [r]ٱلْحُطَمَةِ[/r]”,fr:“Certes non! Il sera précipité dans Al-Hutama.”,tf:”‘Al-Hutama’ : qui broie et fracasse tout. ‘Kalla’ réfute brutalement l’illusion de l’immortalité.”},
{n:5,ar:“وَمَآ أَدْرَاكَ مَا [r]ٱلْحُطَمَةُ[/r]”,fr:“Et qui te dira ce qu’est Al-Hutama?”,tf:“Ce que tu imagines est bien inférieur à la réalité.”},
{n:6,ar:”[q]نَارُ[/q] ٱللَّهِ [r]ٱلْمُوقَدَةُ[/r]”,fr:“C’est le feu d’Allah, allumé,”,tf:”‘Nâr Allah’ — attribution à Allah souligne sa puissance incomparable.”},
{n:7,ar:”[r]ٱلَّتِى[/r] تَطَّلِعُ عَلَى [r]ٱلْأَفْـِٔدَةِ[/r]”,fr:“qui s’élève jusqu’aux cœurs.”,tf:“Ce feu atteint les cœurs — châtiment correspondant au crime : il blessait les cœurs, son cœur sera brûlé.”},
{n:8,ar:“إِنَّهَا عَلَيْهِم [r]مُّؤْصَدَةٌ[/r]”,fr:“elle se referme sur eux,”,tf:“Portes de l’enfer fermées à clé — enfermement total et définitif.”},
{n:9,ar:“فِى عَمَدٍ [r]مُّمَدَّدَةٍۭ[/r]”,fr:“sur des colonnes étirées!”,tf:“Prison aux barreaux d’acier incandescent — emprisonnement inéluctable et éternel.”},
],
105:[
{n:1,ar:“أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَٰبِ [r]ٱلْفِيلِ[/r]”,fr:“N’as-tu pas vu comment ton Seigneur a agi avec les gens de l’Éléphant?”,tf:“An de l’Éléphant (570 EC) = année de naissance du Prophète ﷺ. Abraha marcha sur La Mecque avec des éléphants pour détruire la Ka’ba.”},
{n:2,ar:“أَلَمْ يَجْعَلْ كَيْدَهُمْ فِى تَضْلِيلٍ”,fr:“N’a-t-Il pas rendu vain leur stratagème?”,tf:“Malgré éléphants et armée puissante, le plan fut anéanti — la force matérielle est impuissante face à la protection divine.”},
{n:3,ar:“وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ”,fr:“N’a-t-Il pas envoyé sur eux des oiseaux en rangs serrés,”,tf:“Vols d’oiseaux bombant l’armée avec des pierres — miracle absolu de la protection divine.”},
{n:4,ar:“تَرْمِيهِم بِحِجَارَةٍ [g]مِّن[/g] سِجِّيلٍ”,fr:“qui les bombardaient de pierres d’argile cuite,”,tf:“Projectiles d’argile durcie d’une force dévastatrice divine.”},
{n:5,ar:“فَجَعَلَهُمْ كَعَصْفٍ [r]مَّأْكُولٍۭ[/r]”,fr:“et Il les a rendus pareils à de la paille mâchée.”,tf:“Armée toute-puissante réduite à des résidus — anéantissement total par la volonté divine.”},
],
106:[
{n:1,ar:“لِإِيلَٰفِ [r]قُرَيْشٍ[/r]”,fr:“A cause de l’accoutumance des Quraychites,”,tf:“Liée à Al-Fil : Allah a protégé La Mecque pour assurer la sécurité des caravanes quraychites. ‘Ilaf’ = accords commerciaux et sauf-conduits.”},
{n:2,ar:“إِيلَٰفِهِمْ رِحْلَةَ [r]ٱلشِّتَآءِ[/r] وَ[r]ٱلصَّيْفِ[/r]”,fr:“à leur habitude du voyage d’hiver et d’été,”,tf:“Deux caravanes annuelles : hiver vers le Yémen, été vers la Syrie — source de prospérité et d’influence.”},
{n:3,ar:“فَلْيَعْبُدُوا۟ رَبَّ هَٰذَا [r]ٱلْبَيْتِ[/r]”,fr:“Qu’ils adorent donc le Seigneur de cette Maison,”,tf:“Conclusion logique : puisque Allah leur a accordé sécurité et prospérité, ils doivent L’adorer seul.”},
{n:4,ar:”[r]ٱلَّذِى[/r] أَطْعَمَهُم [g]مِّن[/g] جُوعٍ وَءَامَنَهُم [g]مِّنْ[/g] خَوْفٍ”,fr:“qui les a nourris contre la faim et rassurés contre la peur.”,tf:“Deux bienfaits fondamentaux : subsistance et sécurité — fondements de toute vie civilisée. Accordés grâce à la sainteté de la Ka’ba.”},
],
107:[
{n:1,ar:“أَرَءَيْتَ [r]ٱلَّذِى[/r] يُكَذِّبُ بِ[r]ٱلدِّينِ[/r]”,fr:“As-tu vu celui qui traite la religion de mensonge?”,tf:“Nier la rétribution a des conséquences comportementales : celui qui n’a pas de compte à rendre n’a aucune raison de protéger les faibles.”},
{n:2,ar:“فَذَٰلِكَ [r]ٱلَّذِى[/r] يَدُعُّ [r]ٱلْيَتِيمَ[/r]”,fr:“C’est celui qui repousse l’orphelin,”,tf:“Premier signe : repousser brutalement l’orphelin. L’incroyance se manifeste dans la cruauté envers les vulnérables.”},
{n:3,ar:“وَلَا يَحُضُّ عَلَىٰ طَعَامِ [r]ٱلْمِسْكِينِ[/r]”,fr:“et qui n’encourage pas à nourrir le pauvre.”,tf:“Deuxième signe : indifférence totale face à la misère. Symptôme de mort spirituelle.”},
{n:4,ar:“فَوَيْلٌ لِّلْمُصَلِّينَ”,fr:“Malheur donc aux priants,”,tf:“Avertissement choquant — mais la suite précise de quels priants il s’agit.”},
{n:5,ar:”[r]ٱلَّذِينَ[/r] هُمْ عَن صَلَاتِهِمْ سَاهُونَ”,fr:“ceux qui sont distraits dans leur prière,”,tf:”‘Sahun’ : négligents, inattentifs, retardant leurs prières. Prière habitude sociale, non acte sincère d’adoration.”},
{n:6,ar:”[r]ٱلَّذِينَ[/r] هُمْ يُرَآءُونَ”,fr:“ceux qui prient pour être vus,”,tf:”‘Yura’un’ : ostentation — le shirk mineur que le Prophète ﷺ craignait le plus pour sa communauté.”},
{n:7,ar:“وَيَمْنَعُونَ [r]ٱلْمَاعُونَ[/r]”,fr:“et qui refusent de prêter les ustensiles ordinaires.”,tf:“Refuser même le sel ou l’eau au voisin révèle l’égoïsme extrême. La foi authentique se manifeste dans les petits actes quotidiens.”},
],
108:[
{n:1,ar:“إِنَّ[m]آ[/m] أَعْطَيْنَٰكَ [r]ٱلْكَوْثَرَ[/r]”,fr:“Nous t’avons certes donné l’Abondance.”,tf:”‘Al-Kawthar’ : le bassin du Prophète au paradis, la prophétie, le Coran, des millions de croyants. Consolation après la mort de ses fils.”},
{n:2,ar:“فَصَلِّ لِرَبِّكَ وَ[r]ٱنْحَرْ[/r]”,fr:“Accomplis donc la Salat pour ton Seigneur et sacrifie.”,tf:“En réponse à ces dons immenses : prier et sacrifier exclusivement pour Allah — les deux actes d’adoration corporelle et matérielle les plus importants.”},
{n:3,ar:“إِنَّ شَانِئَكَ هُوَ [r]ٱلْأَبْتَرُ[/r]”,fr:“C’est bien ton ennemi qui est sans postérité.”,tf:“Al-As ibn Wa’il traitait le Prophète d’abtar. Ironie divine : c’est son ennemi qui fut oublié — Muhammad ﷺ est le plus cité au monde chaque jour.”},
],
109:[
{n:1,ar:”[q]قُلْ[/q] يَٰٓأَيُّهَا [r]ٱلْكَٰفِرُونَ[/r]”,fr:“Dis : «Ô vous les mécréants!»”,tf:“Révélée quand les chefs mecquois proposèrent un tour de rôle dans l’adoration. Allah ordonne de déclarer clairement la séparation.”},
{n:2,ar:“لَآ أَعْبُدُ مَا تَعْبُدُونَ”,fr:“Je n’adore pas ce que vous adorez.”,tf:“Déclaration claire du présent : je n’adore pas vos idoles. Pas de compromis en matière de culte.”},
{n:3,ar:“وَلَآ أَنتُمْ عَٰبِدُونَ مَآ أَعْبُدُ”,fr:“Et vous n’adorez pas ce que j’adore.”,tf:“Constatation : vous n’adorez pas Allah tel qu’Il mérite — avec pur tawhid, sans associés.”},
{n:4,ar:“وَلَآ أَنَا۠ عَابِدٌ مَّا عَبَدتُّمْ”,fr:“Je ne suis pas adorateur de ce que vous avez adoré.”,tf:“Confirmation de la constance : jamais je n’adorerai vos idoles, quelle que soit la pression.”},
{n:5,ar:“وَلَآ أَنتُمْ عَٰبِدُونَ مَآ أَعْبُدُ”,fr:“Et vous n’êtes pas adorateurs de ce que j’adore.”,tf:“Ces individus précis ont fait leur choix définitif — Allah savait qu’ils ne croiraient jamais.”},
{n:6,ar:“لَكُمْ دِينُكُمْ وَلِىَ دِينِ”,fr:“A vous votre religion, et à moi ma religion.”,tf:“Séparation nette et respectueuse. Déclaration d’indépendance totale — ‘sourate de la désolidarisation’, libère de toute confusion syncrétiste.”},
],
110:[
{n:1,ar:“إِذَا جَ[m]آءَ[/m] نَصْرُ ٱللَّهِ وَ[r]ٱلْفَتْحُ[/r]”,fr:“Quand arrive le secours d’Allah et la conquête,”,tf:”‘Al-Fath’ = conquête de La Mecque (an 8 H). Révélée lors du dernier pèlerinage, annonçant la fin de la mission et l’approche de la mort du Prophète.”},
{n:2,ar:“وَرَأَيْتَ [r]ٱلنَّاسُ[/r] يَدْخُلُونَ فِى دِينِ ٱللَّهِ أَفْوَاجًا”,fr:“et que tu vois les gens entrer en foule dans la religion d’Allah,”,tf:“Après la conquête, des tribus entières embrassèrent l’islam — ‘afwajan’ (en foules) contraste avec les conversions individuelles des débuts.”},
{n:3,ar:“فَسَبِّحْ بِحَمْدِ رَبِّكَ وَ[r]ٱسْتَغْفِرْهُ[/r] ۚ إِنَّهُۥ كَانَ تَوَّابًۢا”,fr:“alors, célèbre les louanges de ton Seigneur et implore Son pardon. Car Il est certes Grand Accueillant au repentir.”,tf:“La réponse à la victoire : non l’orgueil, mais la reconnaissance et l’istighfar. Aicha : dès cette révélation, il faisait abondamment dhikr — sachant que sa mort approchait.”},
],
111:[
{n:1,ar:“تَبَّتْ يَدَآ أَبِى لَهَبٍ وَتَبَّ”,fr:“Que soient perdues les deux mains d’Abou Lahab!”,tf:“Abu Lahab, oncle du Prophète et ennemi acharné, cria ‘Que tu périsses!’ quand le Prophète appela à l’islam. Seule sourate condamnant quelqu’un par nom.”},
{n:2,ar:“مَ[m]آ[/m] أَغْنَىٰ عَنْهُ مَالُهُۥ وَمَا كَسَبَ”,fr:“Sa fortune ne lui a servi à rien, ni ce qu’il a acquis.”,tf:“Toute sa richesse ne put le protéger de la malédiction divine ni éviter sa mort.”},
{n:3,ar:“سَيَصْلَىٰ نَارًا ذَاتَ لَهَبٍ”,fr:“Il brûlera dans un feu plein de flammes.”,tf:“Ironie divine : ‘lahab’ (flamme) dans son surnom préfigurait son destin dans l’enfer.”},
{n:4,ar:“وَ[r]ٱمْرَأَتُهُۥ[/r] حَمَّالَةَ [r]ٱلْحَطَبِ[/r]”,fr:“Et sa femme, porteuse de bois de brandon,”,tf:“Umm Jamil portait des épines sur le chemin du Prophète. ‘Hammalat al-hatab’ peut aussi signifier ‘colporteuse de ragots’.”},
{n:5,ar:“فِى جِيدِهَا حَبْلٌ [g]مِّن[/g] [r]مَّسَدٍۭ[/r]”,fr:“aura à son cou une corde de fibres de palmier.”,tf:“Justice parfaite du talion divin : celle qui portait des fardeaux pour nuire portera un fardeau éternel.”},
],
112:[
{n:1,ar:”[q]قُلْ[/q] هُوَ ٱللَّهُ أَحَدٌ”,fr:“Dis : «Il est Allah, Unique»”,tf:“Équivaut au tiers du Coran (Prophète ﷺ). ‘Ahad’ — Un absolu, unique dans Son essence, aucun comparable ni avant ni après.”},
{n:2,ar:“ٱللَّهُ [r]ٱلصَّمَدُ[/r]”,fr:“Allah, le Seul à être imploré pour ce que nous désirons.”,tf:”‘As-Samad’ : vers qui toutes les créatures se tournent dans le besoin, Lui n’ayant besoin de rien. L’Absolu, le Parfait, l’Indépendant.”},
{n:3,ar:“لَمْ يَلِدْ وَلَمْ يُولَدْ”,fr:“Il n’a jamais engendré, n’a pas été engendré non plus.”,tf:“Réfutation des déviations : fils (chrétiens), filles (Arabes polythéistes), généalogie divine. Allah est au-delà de toute naissance.”},
{n:4,ar:“وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌ”,fr:“Et nul n’est égal à Lui.”,tf:“Aucun équivalent dans l’essence, les attributs, les actes. Fondement du tawhid al-asmaa was-sifat. Cette sourate résume toute la théologie islamique.”},
],
113:[
{n:1,ar:”[q]قُلْ[/q] أَعُوذُ بِرَبِّ [r]ٱلْفَلَقِ[/r]”,fr:“Dis : «Je cherche refuge auprès du Seigneur de l’Aube naissante»”,tf:“Al-Falaq : aube, lumière dissipant les ténèbres. Al-Mu’awwidhatain — les deux sourates de protection. Révélées pour le Prophète envoûté par Labid ibn al-Asam.”},
{n:2,ar:”[g]مِن[/g] شَرِّ مَا خَلَقَ”,fr:“contre le mal de ce qu’Il a créé,”,tf:“Protection générale contre tout mal issu de la création — humains, animaux, démons, catastrophes.”},
{n:3,ar:“وَ[g]مِن[/g] شَرِّ غَاسِقٍ إِذَا وَقَبَ”,fr:“contre le mal de l’obscurité quand elle s’étend,”,tf:“La nuit profonde — moment où mauvais esprits et dangers sont plus actifs. Le Prophète ﷺ montrait la lune : ‘Cherche refuge contre le mal de ceci.’”},
{n:4,ar:“وَ[g]مِن[/g] شَرِّ [r]ٱلنَّفَّٰثَٰتِ[/r] فِى [r]ٱلْعُقَدِ[/r]”,fr:“contre le mal des souffleuses dans les nœuds,”,tf:“Femmes pratiquant la magie en soufflant sur des nœuds. En récitant Al-Mu’awwidhatain, le Prophète fut guéri de l’envoûtement.”},
{n:5,ar:“وَ[g]مِن[/g] شَرِّ حَاسِدٍ إِذَا حَسَدَ”,fr:“contre le mal de l’envieux quand il envie.”,tf:“La jalousie peut provoquer le mauvais œil — réalité confirmée par le Prophète ﷺ. Le mal ne vient que quand la jalousie se manifeste activement.”},
],
114:[
{n:1,ar:”[q]قُلْ[/q] أَعُوذُ بِرَبِّ [r]ٱلنَّاسِ[/r]”,fr:“Dis : «Je cherche refuge auprès du Seigneur des hommes,»”,tf:“Dernière sourate. Trois titres majestueux : Seigneur, Roi, Dieu des hommes — résumant les trois types de tawhid.”},
{n:2,ar:“مَلِكِ [r]ٱلنَّاسِ[/r]”,fr:“du Roi des hommes,”,tf:”‘Malik an-nas’ — royauté absolue, éternelle, universelle. Protection qu’aucun roi terrestre ne peut offrir.”},
{n:3,ar:“إِلَٰهِ [r]ٱلنَّاسِ[/r]”,fr:“du Dieu des hommes,”,tf:”‘Ilah an-nas’ — seul digne d’adoration. La sourate est un résumé du monothéisme islamique.”},
{n:4,ar:”[g]مِن[/g] شَرِّ [r]ٱلْوَسْوَاسِ[/r] [r]ٱلْخَنَّاسِ[/r]”,fr:“contre le mal du tentateur sournois”,tf:”‘Al-waswas’ : le chuchoteur. ‘Al-khannas’ : qui recule quand on mentionne Allah. Shaytan susurre mais recule dès qu’Allah est mentionné.”},
{n:5,ar:”[r]ٱلَّذِى[/r] يُوَسْوِسُ فِى صُدُورِ [r]ٱلنَّاسِ[/r]”,fr:“qui souffle le mal dans les poitrines des hommes,”,tf:“Shaytan suggère doucement depuis l’intérieur. La protection : se réfugier constamment auprès d’Allah.”},
{n:6,ar:”[g]مِنَ[/g] [r]ٱلْجِنَّةِ[/r] وَ[r]ٱلنَّاسِ[/r]”,fr:“qu’il soit parmi les djinns ou parmi les hommes.”,tf:“Le tentateur peut être djinn ou humain. Conclusion parfaite du Coran : nous nous réfugions auprès d’Allah de tout mal, visible ou invisible.”},
],
};

// ─── Tajwid component ──────────────────────────────────────────────────────────
function TajwidSpan({text, enabled, tjc}) {
if (!enabled) {
// Strip any tajwid markup if present (for safety)
const clean = text.replace(/[[mgqrt]](.*?)[/[mgqrt]]/g, “$1”);
return <span>{clean}</span>;
}
const parts=[];
const regex=/[([mgqrt])](.*?)[/\1]/g; // new regex per call, no stale state
let last=0, m;
const colors={m:tjc.m,g:tjc.g,q:tjc.q,r:tjc.r,t:tjc.t};
while ((m=regex.exec(text))!==null) {
if (m.index>last) parts.push(<span key={last}>{text.slice(last,m.index)}</span>);
parts.push(<span key={m.index} style={{color:colors[m[1]]||tjc.r,fontWeight:700}}>{m[2]}</span>);
last=m.index+m[0].length;
}
if (last<text.length) parts.push(<span key={`e${last}`}>{text.slice(last)}</span>);
return <>{parts}</>;
}

body{background:${t.bg};color:${t.tx};font-family:‘DM Sans’,sans-serif;min-height:100vh;padding-bottom:80px;}

::-webkit-scrollbar-thumb{background:${t.b2};border-radius:99px;}

/* ── Geometric Islamic background ── */
body::before{
content:’’;
position:fixed;inset:0;
pointer-events:none;
z-index:0;
opacity:${tn===“dark”?”.018”:”.035”};
background-image:
repeating-linear-gradient(0deg,transparent,transparent 40px,${t.acc} 40px,${t.acc} 41px),
repeating-linear-gradient(90deg,transparent,transparent 40px,${t.acc} 40px,${t.acc} 41px),
repeating-linear-gradient(45deg,transparent,transparent 28px,${t.acc} 28px,${t.acc} 29px),
repeating-linear-gradient(-45deg,transparent,transparent 28px,${t.acc} 28px,${t.acc} 29px);
}
body>*{position:relative;z-index:1;}

/* ── Animations ── */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes memGlow{0%{box-shadow:0 0 0 0 ${t.gr}66}70%{box-shadow:0 0 0 10px ${t.gr}00}100%{box-shadow:0 0 0 0 ${t.gr}00}}
@keyframes confetti{0%{transform:scale(1) rotate(0deg);opacity:1}50%{transform:scale(1.4) rotate(10deg);opacity:.8}100%{transform:scale(1) rotate(0deg);opacity:1}}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

// ─── MushafPage component ──────────────────────────────────────────────────────
function MushafPage({page, t}) {
const [srcIdx, setSrcIdx] = useState(0);
const [loaded, setLoaded] = useState(false);
const pg = String(page).padStart(3,“0”);
const sources = [
`https://static.qurancdn.com/images/background/page${pg}.jpg`,
`https://www.searchtruth.com/quran/images/pages/page${pg}.jpg`,
`https://everyayah.com/data/images_png/pages/page${pg}.png`,
`https://qurancdn.com/images/pages/page${pg}.png`,
];
useEffect(()=>{ setSrcIdx(0); setLoaded(false); },[page]);
return (
<div style={{width:“100%”,position:“relative”,minHeight:400}}>
{!loaded&&(
<div style={{position:“absolute”,inset:0,display:“flex”,flexDirection:“column”,alignItems:“center”,justifyContent:“center”,background:”#f5f0e8”,gap:12}}>
<div style={{width:32,height:32,border:“3px solid #d4a843”,borderTopColor:“transparent”,borderRadius:“50%”,animation:“spin .7s linear infinite”}}/>
<div style={{fontSize:”.75rem”,color:”#888”}}>Chargement page {page}…</div>
<div style={{fontSize:”.65rem”,color:”#aaa”}}>Connexion internet requise</div>
</div>
)}
<img
key={`${page}-${srcIdx}`}
src={sources[srcIdx]}
alt={`Page ${page} du Mushaf`}
style={{width:“100%”,display:loaded?“block”:“none”,maxWidth:“100%”}}
onLoad={()=>setLoaded(true)}
onError={()=>{
if(srcIdx<sources.length-1){ setSrcIdx(i=>i+1); }
else {
setLoaded(true); // show error state
}
}}
/>
{loaded&&srcIdx>=sources.length&&(
<div style={{padding:20,textAlign:“center”,color:”#888”,fontSize:”.78rem”}}>
Image non disponible — vérifie la connexion internet
</div>
)}
</div>
);
}

// ─── Main App ──────────────────────────────────────────────────────────────────
function App() {
const [tn, setTn] = useState(()=>ld(“qtheme”,“dark”));
const t = THEMES[tn]||THEMES.dark;
const tjc = tn===“dark”?TJC_DARK:TJC_LIGHT;

const [fontId, setFontId] = useState(()=>ld(“qfont”,“amiri-quran”));
const arFont = (FONTS.find(f=>f.id===fontId)||FONTS[0]).css;

// Core state
const [mem, setMem] = useState(()=>ld(“qmem6”,{}));
const [settings, setSettings] = useState(()=>ld(“qset6”,null));
const [hist, setHist] = useState(()=>ld(“qhist6”,{}));
const [setup, setSetup] = useState(()=>!ld(“qset6”,null));
const [page, setPage] = useState(“quran”);

// Quran page
const [ltab, setLtab] = useState(“list”);
const [selS, setSelS] = useState(null);
const [selJuz, setSelJuz] = useState(null);
const [search, setSearch] = useState(””);
const [showTr, setShowTr] = useState(true);
const [showTj, setShowTj] = useState(true);
const [showTf, setShowTf] = useState(false);
const [showPage, setShowPage] = useState(false);
const [mushafPage, setMushafPage] = useState(null);
const [rec, setRec] = useState(RECITERS[0]);
const [playing, setPlaying] = useState(null);

// Khatma state
const [khatmas, setKhatmas] = useState(()=>ld(“qkhatmas”,[]));
const [activeKhatma, setActiveKhatma] = useState(()=>ld(“qakthatma”,null));
const [kPreset, setKPreset] = useState(null);
const [kCustomDays, setKCustomDays] = useState(“30”);
const [kName, setKName] = useState(“Ma Khatma”);

// Settings
const [goal, setGoal] = useState(“5”);
const [startDate, setStartDate] = useState(new Date().toISOString().split(“T”)[0]);

// New features state
const [arabicSize, setArabicSize] = useState(()=>ld(“qasize”,1.65));
const [loopCount, setLoopCount] = useState(3);
const [loopCurrent, setLoopCurrent] = useState(0);
const [reviewMode, setReviewMode] = useState(false);
const [revealedVerses, setRevealedVerses] = useState({});
const [bookmark, setBookmark] = useState(()=>ld(“qbookmark”,null));
const [spaced, setSpaced] = useState(()=>ld(“qspaced”,{}));
const [badges, setBadges] = useState(()=>ld(“qbadges”,[]));
const [autoNight, setAutoNight] = useState(()=>ld(“qautonight”,false));
const [playbackRate, setPlaybackRate] = useState(1);
const [favorites, setFavorites] = useState(()=>ld(“qfavs”,[])); // [{sn,vn,ar,fr,surah}]
const [notes, setNotes] = useState(()=>ld(“qnotes”,{})); // {“sn_vn”: text}
const [lists, setLists] = useState(()=>ld(“qlists”,[])); // [{id,name,items:[{sn,vn}]}]
const [editingNote, setEditingNote] = useState(null); // “sn_vn”
const [noteText, setNoteText] = useState(””);
const [shareVerse, setShareVerse] = useState(null);
const [newListName, setNewListName] = useState(””);
const [selList, setSelList] = useState(null);
const [immersive, setImmersive] = useState(false);
const touchStartX = useRef(null);
const touchStartY = useRef(null);

// Swipe handlers for surah navigation
const handleTouchStart = useCallback((e)=>{
touchStartX.current = e.touches[0].clientX;
touchStartY.current = e.touches[0].clientY;
},[]);

const handleTouchEnd = useCallback((e)=>{
if(!touchStartX.current||!selS) return;
const dx = touchStartX.current - e.changedTouches[0].clientX;
const dy = Math.abs(touchStartY.current - e.changedTouches[0].clientY);
if(Math.abs(dx)>60 && dy<50) {
// Horizontal swipe — navigate surahs
const idx = SURAHS.findIndex(s=>s.n===selS.n);
if(dx>0 && idx<SURAHS.length-1) doSelect(SURAHS[idx+1]); // swipe left = next
if(dx<0 && idx>0) doSelect(SURAHS[idx-1]); // swipe right = prev
}
touchStartX.current = null;
},[selS]);
useEffect(()=>sv(“qbookmark”,bookmark),[bookmark]);
useEffect(()=>sv(“qspaced”,spaced),[spaced]);
useEffect(()=>sv(“qbadges”,badges),[badges]);
useEffect(()=>sv(“qautonight”,autoNight),[autoNight]);
useEffect(()=>sv(“qfavs”,favorites),[favorites]);
useEffect(()=>sv(“qnotes”,notes),[notes]);
useEffect(()=>sv(“qlists”,lists),[lists]);

// Playback speed
useEffect(()=>{
if(audioRef.current) audioRef.current.playbackRate=playbackRate;
},[playbackRate,playing]);

const toggleFav=(sn,vn,ar,fr,surah)=>{
const key=`${sn}_${vn}`;
setFavorites(p=>p.find(f=>f.key===key)?p.filter(f=>f.key!==key):[...p,{key,sn,vn,ar,fr,surah}]);
};
const isFav=(sn,vn)=>favorites.some(f=>f.key===`${sn}_${vn}`);

const saveNote=(sn,vn,text)=>{
const k=`${sn}_${vn}`;
if(text.trim()) setNotes(p=>({...p,[k]:text.trim()}));
else setNotes(p=>{const n={...p};delete n[k];return n;});
setEditingNote(null);
};

const createList=(name)=>{
if(!name.trim()) return;
const nl={id:Date.now(),name:name.trim(),items:[]};
setLists(p=>[...p,nl]);
setNewListName(””);
return nl;
};

const addToList=(listId,sn,vn)=>{
setLists(p=>p.map(l=>l.id===listId?{...l,items:l.items.find(i=>i.sn===sn&&i.vn===vn)?l.items:[...l.items,{sn,vn}]}:l));
};

const removeFromList=(listId,sn,vn)=>{
setLists(p=>p.map(l=>l.id===listId?{...l,items:l.items.filter(i=>!(i.sn===sn&&i.vn===vn))}:l));
};

// Auto night mode
useEffect(()=>{
if(!autoNight) return;
const h=new Date().getHours();
if(h>=20||h<7) setTn(“dark”); else setTn(“light”);
},[autoNight]);

// Badge checker
useEffect(()=>{
const newBadges=[];
const completedSurahs=SURAHS.filter(s=>sMem(s)===s.v);
if(completedSurahs.length>=1&&!badges.includes(“first_surah”)) newBadges.push(“first_surah”);
if(completedSurahs.length>=10&&!badges.includes(“ten_surahs”)) newBadges.push(“ten_surahs”);
if(totalMem>=100&&!badges.includes(“100_verses”)) newBadges.push(“100_verses”);
if(totalMem>=500&&!badges.includes(“500_verses”)) newBadges.push(“500_verses”);
if(totalMem>=1000&&!badges.includes(“1000_verses”)) newBadges.push(“1000_verses”);
const juz30=SURAHS.filter(s=>s.juz===30).every(s=>sMem(s)===s.v);
if(juz30&&!badges.includes(“juz30”)) newBadges.push(“juz30”);
if(newBadges.length>0) setBadges(p=>[...p,...newBadges]);
},[mem]);

// Spaced repetition due versets
const spacedDue = useMemo(()=>{
const now=Date.now();
const intervals=[1,3,7,30].map(d=>d*86400000);
return Object.entries(spaced).filter(([k,v])=>{
const reviews=v.count||0;
const interval=intervals[Math.min(reviews,intervals.length-1)];
return now-v.last>interval;
}).map(([k])=>k);
},[spaced]);

const markSpaced=(sn,vn)=>{
const k=`${sn}_${vn}`;
setSpaced(p=>({...p,[k]:{last:Date.now(),count:(p[k]?.count||0)+1}}));
};

const audioRef = useRef(null);
const vpRef = useRef(null);

// Persist
useEffect(()=>sv(“qmem6”,mem),[mem]);
useEffect(()=>sv(“qset6”,settings),[settings]);
useEffect(()=>sv(“qhist6”,hist),[hist]);
useEffect(()=>sv(“qtheme”,tn),[tn]);
useEffect(()=>sv(“qfont”,fontId),[fontId]);
useEffect(()=>sv(“qkhatmas”,khatmas),[khatmas]);
useEffect(()=>sv(“qakthatma”,activeKhatma),[activeKhatma]);

// Track daily versets
useEffect(()=>{
const tod=today();
const tot=Object.values(mem).reduce((s,v)=>s+Object.keys(v).length,0);
setHist(h=>({...h,[tod]:tot}));
},[mem]);

// Derived
const totalMem = useMemo(()=>Object.values(mem).reduce((s,v)=>s+Object.keys(v).length,0),[mem]);
const remaining = TOTAL_VERSES - totalMem;
const pct = +(totalMem/TOTAL_VERSES*100).toFixed(1);

const {vpd, daysLeft, eta} = useMemo(()=>{
if (!settings) return {vpd:5, daysLeft:0, eta:”-”};
const start=new Date(settings.startDate), now=new Date();
const dp=Math.max(1,Math.floor((now-start)/86400000));
const rate=totalMem>0?Math.round(totalMem/dp):parseInt(settings.dailyGoal)||5;
const eff=Math.max(rate,1);
const days=remaining>0?Math.ceil(remaining/eff):0;
const d=new Date(); d.setDate(d.getDate()+days);
return {vpd:eff, daysLeft:days,
eta:remaining>0?d.toLocaleDateString(“fr-FR”,{day:“numeric”,month:“long”,year:“numeric”}):“🎉 Terminé!”};
},[settings, totalMem, remaining]);

const sMem=(s)=>Object.keys(mem[String(s.n)]||{}).length;
const sPct=(s)=>Math.round(sMem(s)/s.v*100);
const juzPct=(j)=>{
const ss=SURAHS.filter(s=>s.juz===j);
const tot=ss.reduce((a,s)=>a+s.v,0), don=ss.reduce((a,s)=>a+sMem(s),0);
return tot>0?Math.round(don/tot*100):0;
};

const doSelect=(s)=>{
setSelS(s); setPlaying(null);
setMushafPage(SURAH_PAGE[s.n]||1);
if(audioRef.current) { audioRef.current.pause(); audioRef.current.src=””; }
setTimeout(()=>vpRef.current?.scrollIntoView({behavior:“smooth”,block:“start”}),60);
};

const toggleV=(sn,vn)=>setMem(p=>{
const k=String(sn), vk=String(vn), c={...p[k]||{}};
if(c[vk]) delete c[vk]; else c[vk]=true;
return {...p,[k]:c};
});

const toggleAll=(s)=>{
const k=String(s.n), done=sMem(s)===s.v;
setMem(p=>{
if(done){const n={...p};delete n[k];return n;}
const a={}; for(let i=1;i<=s.v;i++) a[String(i)]=true;
return {...p,[k]:a};
});
};

const doPlay=(vn)=>{
if(!selS||!audioRef.current) return;
if(playing===vn){
if(!audioRef.current.paused) audioRef.current.pause();
else audioRef.current.play().catch(()=>{});
return;
}
audioRef.current.pause();
const sn=String(selS.n).padStart(3,“0”), vnn=String(vn).padStart(3,“0”);
const url=`https://cdn.islamic.network/quran/audio/128/${rec.id}/${sn}${vnn}.mp3`;
audioRef.current.src=url;
audioRef.current.load();
setPlaying(vn);
audioRef.current.play().catch(()=>{ setPlaying(null); });
};

// Handle loop repetition
useEffect(()=>{
if(!audioRef.current) return;
const handleEnded=()=>{
if(loopCount>1&&loopCurrent<loopCount){
setLoopCurrent(p=>p+1);
setTimeout(()=>{
if(audioRef.current&&playing!==null){
audioRef.current.currentTime=0;
audioRef.current.play().catch(()=>{});
}
},500);
} else {
setPlaying(null);
setLoopCurrent(0);
}
};
audioRef.current.addEventListener(“ended”,handleEnded);
return ()=>audioRef.current?.removeEventListener(“ended”,handleEnded);
},[playing,loopCount,loopCurrent]);

// Verses with API fetch + localStorage cache
const [verses, setVerses] = useState([]);
const [loadState, setLoadState] = useState(“idle”); // idle | loading | done | error

useEffect(()=>{
if(!selS){ setVerses([]); setLoadState(“idle”); return; }
// 1) Embedded data
if(Q[selS.n]){ setVerses(Q[selS.n]); setLoadState(“done”); return; }
// 2) localStorage cache
const cacheKey=`qv_${selS.n}`;
try{
const cached=localStorage.getItem(cacheKey);
if(cached){ setVerses(JSON.parse(cached)); setLoadState(“done”); return; }
}catch{}
// 3) Fetch from API (runs in browser, not in sandbox)
setVerses([]); setLoadState(“loading”);
Promise.all([
fetch(`https://api.alquran.cloud/v1/surah/${selS.n}/quran-uthmani`).then(r=>r.json()),
fetch(`https://api.alquran.cloud/v1/surah/${selS.n}/fr.hamidullah`).then(r=>r.json()),
]).then(([arData, frData])=>{
const arAyahs=arData?.data?.ayahs||[];
const frAyahs=frData?.data?.ayahs||[];
if(!arAyahs.length){ setLoadState(“error”); return; }
const result=arAyahs.map((a,i)=>({
n:a.numberInSurah,
ar:a.text,
fr:frAyahs[i]?.text||””,
tf:””,
}));
setVerses(result);
setLoadState(“done”);
try{ localStorage.setItem(cacheKey, JSON.stringify(result)); }catch{}
}).catch(()=>setLoadState(“error”));
},[selS]);

const filtered = useMemo(()=>{
const q=search.toLowerCase().trim();
if(!q) return SURAHS;
return SURAHS.filter(s=>s.name.toLowerCase().includes(q)||s.ar.includes(q)||String(s.n).includes(q));
},[search]);

const juzList=[...new Set(SURAHS.map(s=>s.juz))].sort((a,b)=>a-b);

// Khatma logic
const createKhatma=()=>{
if(!kPreset) return;
const days=kPreset.id===“custom”?parseInt(kCustomDays)||30:kPreset.days;
const nk={id:Date.now(), name:kName, preset:kPreset.id, totalDays:days,
startDate:today(), log:{}, pages:604};
setKhatmas(p=>[...p,nk]);
setActiveKhatma(nk);
setKPreset(null);

setKhatmas(p=>p.map(x=>x.id===k.id?updated:x));
if(activeKhatma?.id===k.id) setActiveKhatma(updated);
};

const getKhatmaDays=(k)=>{
const days=[]; const start=new Date(k.startDate);
for(let i=0;i<k.totalDays;i++){
const d=new Date(start); d.setDate(d.getDate()+i);
days.push(d.toISOString().split(“T”)[0]);
}
return days;
};

const khatmaStreak=(k)=>{
const days=getKhatmaDays(k).filter(d=>d<=today()).reverse();
let streak=0;
for(const d of days){ if(k.log[d]) streak++; else break; }
return streak;
};

                    <div className="v-info">Sourate {selS.n} · {selS.name} · Juz {selS.juz} · {selS.v} versets · {selS.type}</div>
                    <div style={{fontSize:".6rem",color:t.tx3,marginTop:2}}>
                      {sMem(selS)}/{selS.v} mémorisés ({sPct(selS)}%)
                      {vpd>0&&sMem(selS)<selS.v&&<span style={{marginLeft:8,color:t.bl}}>· ~{Math.ceil((selS.v-sMem(selS))/vpd)} jours</span>}
                      {loadState==="error"&&<span style={{marginLeft:8,color:t.rd}}>· erreur chargement</span>}
                      {loadState==="loading"&&<span style={{marginLeft:8,color:t.tx3}}>· chargement…</span>}
                    </div>
                  </div>
                  <button className="tbtn" onClick={()=>toggleAll(selS)} style={{flexShrink:0}}>
                    {sMem(selS)===selS.v?"Tout décocher":"Tout cocher"}
                  </button>
                </div>
                <div className="vbar"><div className="vfill" style={{width:`${sPct(selS)}%`}}/></div>
              </div>

              <div className="vtoolbar">
                <button className={`tbtn ${showTj?"on":""}`} onClick={()=>setShowTj(v=>!v)}>Tajwid</button>
                <button className={`tbtn ${showTr?"on":""}`} onClick={()=>setShowTr(v=>!v)}>Traduction</button>
                <button className={`tbtn ${showTf?"on":""}`} onClick={()=>setShowTf(v=>!v)}>Tafsir</button>
                <button className={`tbtn ${showPage?"on":""}`} onClick={()=>setShowPage(v=>!v)}>Page</button>
                <button className={`tbtn ${reviewMode?"on":""}`}
                  style={reviewMode?{background:t.rd,borderColor:t.rd,color:"#fff"}:{}}
                  onClick={()=>{setReviewMode(v=>!v);setRevealedVerses({});}}>
                  {reviewMode?"Quitter révision":"Révision"}
                </button>
                <button className="tbtn" onClick={()=>setImmersive(true)} title="Mode lecture immersive">
                  Immersif
                </button>
                <select className="tsel" value={rec.id} onChange={e=>setRec(RECITERS.find(r=>r.id===e.target.value)||RECITERS[0])}>
                  {RECITERS.map(r=><option key={r.id} value={r.id}>{r.name}</option>)}
                </select>
                <div style={{display:"flex",alignItems:"center",gap:4,marginLeft:"auto"}}>
                  <span style={{fontSize:".6rem",color:t.tx3}}>Taille</span>
                  <button className="tbtn" onClick={()=>setArabicSize(s=>Math.max(1,s-0.15))}>A-</button>
                  <button className="tbtn" onClick={()=>setArabicSize(s=>Math.min(3,s+0.15))}>A+</button>
                </div>
              </div>

              {/* Virtue & occasions */}
              {SURAH_INFO[selS.n]&&(
                <div style={{padding:"10px 14px",background:t.s3,borderBottom:`1px solid ${t.b1}`,fontSize:".7rem",color:t.tx2,lineHeight:1.6}}>
                  <div style={{fontWeight:700,color:t.acc,marginBottom:3,fontSize:".65rem",textTransform:"uppercase",letterSpacing:"1px"}}>Vertus & occasions</div>
                  <div style={{marginBottom:4}}>{SURAH_INFO[selS.n].virtue}</div>
                  <div style={{color:t.gr,fontWeight:600}}>Quand réciter : {SURAH_INFO[selS.n].occasion}</div>
                </div>
              )}

              {/* Review mode banner */}
              {reviewMode&&(
                <div style={{padding:"8px 14px",background:`${t.rd}22`,borderBottom:`1px solid ${t.rd}44`,display:"flex",alignItems:"center",gap:8}}>
                  <div style={{fontSize:".72rem",color:t.rd,fontWeight:600,flex:1}}>
                    Mode révision — le texte est masqué, récite puis appuie pour révéler
                  </div>
                  <button className="tbtn" style={{borderColor:t.rd,color:t.rd}}
                    onClick={()=>setRevealedVerses({})}>Tout masquer</button>
                </div>
              )}

              {/* Loop audio control */}
              <div style={{padding:"6px 14px",background:t.s2,borderBottom:`1px solid ${t.b1}`,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <span style={{fontSize:".62rem",color:t.tx3}}>Répétition :</span>
                {[1,3,5,10].map(n=>(
                  <button key={n} className={`tbtn ${loopCount===n?"on":""}`}
                    onClick={()=>setLoopCount(n)} style={{minWidth:28}}>{n}x</button>
                ))}
                {loopCurrent>0&&(
                  <span style={{fontSize:".62rem",color:t.acc,marginLeft:4}}>{loopCurrent}/{loopCount}</span>
                )}
                <span style={{fontSize:".62rem",color:t.tx3,marginLeft:8}}>Vitesse :</span>
                {[0.75,1,1.25,1.5].map(s=>(
                  <button key={s} className={`tbtn ${playbackRate===s?"on":""}`}
                    onClick={()=>setPlaybackRate(s)} style={{minWidth:36}}>{s}x</button>
                ))}
                <button className="tbtn" style={{marginLeft:"auto",borderColor:bookmark?.sn===selS.n?t.acc:t.b2,color:bookmark?.sn===selS.n?t.acc:t.tx3}}
                  onClick={()=>setBookmark({sn:selS.n,name:selS.name})}>
                  {bookmark?.sn===selS.n?"Signet ✓":"Signet"}
                </button>
              </div>

              {/* ── Page Mushaf — affichage pleine page ── */}
              {showPage&&(
                <div style={{background:t.s1}}>
                  {/* Navigation pages */}
                  <div style={{display:"flex",alignItems:"center",gap:6,padding:"8px 12px",borderBottom:`1px solid ${t.b1}`,background:t.s2}}>
                    <button className="tbtn" onClick={()=>setMushafPage(p=>Math.max(1,(p||SURAH_PAGE[selS.n]||1)-1))}>←</button>
                    <span style={{flex:1,textAlign:"center",fontSize:".72rem",color:t.tx2,fontWeight:600}}>
                      Page {mushafPage||SURAH_PAGE[selS.n]||1} / 604
                    </span>
                    <button className="tbtn" onClick={()=>setMushafPage(p=>Math.min(604,(p||SURAH_PAGE[selS.n]||1)+1))}>→</button>
                    <button
                      className={`tbtn ${pageRead[String(mushafPage||SURAH_PAGE[selS.n]||1)]?"on":""}`}
                      onClick={()=>togglePage(mushafPage||SURAH_PAGE[selS.n]||1)}>
                      {pageRead[String(mushafPage||SURAH_PAGE[selS.n]||1)]?"Lue ✓":"Marquer lue"}
                    </button>
                  </div>
                  {/* Image pleine page */}
                  <div style={{width:"100%",background:"#fff",minHeight:400,display:"flex",alignItems:"center",justifyContent:"center"}}>
                    <img
                      key={mushafPage||SURAH_PAGE[selS.n]||1}
                      src={`https://static.qurancdn.com/images/background/page${String(mushafPage||SURAH_PAGE[selS.n]||1).padStart(3,"0")}.jpg`}
                      alt={`Page ${mushafPage||SURAH_PAGE[selS.n]||1}`}
                      style={{width:"100%",display:"block",maxWidth:"100%"}}
                      onError={e=>{
                        const pg=String(mushafPage||SURAH_PAGE[selS.n]||1).padStart(3,"0");
                        if(!e.target.dataset.fb2){
                          e.target.dataset.fb2="1";
                          e.target.src=`https://everyayah.com/data/images_png/pages/page${pg}.png`;
                        } else if(!e.target.dataset.fb3){
                          e.target.dataset.fb3="1";
                          e.target.src=`https://www.searchtruth.com/quran/images/pages/page${pg}.jpg`;
                        } else {
                          e.target.replaceWith(Object.assign(document.createElement("div"),{
                            textContent:"Image non disponible — vérifier la connexion",
                            style:`padding:20px;text-align:center;color:${t.tx3};font-size:.75rem`
                          }));
                        }
                      }}
                    />
                  </div>
                </div>
              )}

              {showTj&&(
                <div className="tj-legend">
                  <span style={{color:t.tx3,marginRight:3,fontSize:".6rem"}}>Tajwid :</span>
                  {[
                    [tjc.q,"Qalqala — ق ط ب ج د"],
                    [tjc.m,"Madd 6 harakat"],
                    [tjc.r,"Madd 4-5 harakat"],
                    [tjc.g,"Ghunna / Ikhfa / Idgham"],
                    [tjc.t,"Tafkhim"],
                  ].map(([c,l])=>(
                    <div key={l} className="tj-item">
                      <div className="tj-dot" style={{background:c}}/>
                      <span style={{color:t.tx2,fontSize:".6rem"}}>{l}</span>
                    </div>
                  ))}
                </div>
              )}

              {playing!==null&&(
                <div className="arow">
                  <button className="vbtn snd" style={{flexShrink:0}} onClick={()=>doPlay(playing)}>
                    <Icons.Play size={11}/>{audioRef.current?.paused?"▶":"⏸"}
                  </button>
                  <span style={{fontSize:".62rem",color:t.tx2,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                    {selS?.name} · v.{playing} · {rec.name}
                  </span>
                  <button className="tbtn" style={{flexShrink:0}} onClick={()=>{
                    setPlaying(null);
                    if(audioRef.current){audioRef.current.pause();audioRef.current.src="";}
                  }}>✕</button>
                </div>
              )}

              <div className="vscroll"
                onTouchStart={handleTouchStart}
                onTouchEnd={handleTouchEnd}>
                {loadState==="loading"&&(
                  <div style={{textAlign:"center",padding:"30px 14px",color:t.tx3}}>
                    <div style={{display:"inline-block",width:22,height:22,border:`2px solid ${t.b2}`,borderTopColor:t.acc,borderRadius:"50%",animation:"spin .7s linear infinite",marginBottom:10}}/>
                    <div style={{fontSize:".8rem"}}>Chargement des versets…</div>
                    <div style={{fontSize:".65rem",marginTop:4,color:t.tx3}}>Vérifier la connexion internet</div>
                  </div>
                )}
                {loadState==="error"&&(
                  <div style={{textAlign:"center",padding:"24px 14px",color:t.rd,fontSize:".78rem"}}>
                    <div style={{fontSize:"1.8rem",marginBottom:8}}>⚠️</div>
                    Impossible de charger cette sourate.<br/>
                    <span style={{fontSize:".65rem",color:t.tx3}}>Vérifie ta connexion internet et réessaie.</span><br/>
                    <button className="tbtn" style={{marginTop:10,borderColor:t.acc,color:t.acc}} onClick={()=>{
                      const s=selS; setSelS(null); setTimeout(()=>setSelS(s),50);
                    }}>↻ Réessayer</button>
                  </div>
                )}
                {loadState==="done"&&verses.map(v=>{
                  const isMem=!!(mem[String(selS.n)]||{})[String(v.n)];
                  const isPl=playing===v.n;
                  const isRevealed=!!revealedVerses[v.n];
                  const spacedKey=`${selS.n}_${v.n}`;
                  const isDue=spacedDue.includes(spacedKey);
                  return (
                    <div key={v.n} className={`vitem ${isMem?"mem":""} ${isPl?"pl":""} ${isDue?"due":""}`}>
                      <div className="vtop">
                        <div className={`vnum ${isMem?"mem":""} ${isPl?"pl":""}`} onClick={()=>toggleV(selS.n,v.n)}>
                          {isMem?<Icons.Check size={11} color={t.gr}/>:v.n}
                        </div>
                        <div className="var-text" style={{fontSize:`${arabicSize}rem`}}>
                          {reviewMode&&!isRevealed?(
                            <div style={{
                              background:t.b1,borderRadius:8,padding:"8px 14px",
                              cursor:"pointer",textAlign:"center",color:t.tx3,fontSize:".75rem",
                              userSelect:"none",
                            }} onClick={()=>setRevealedVerses(p=>({...p,[v.n]:true}))}>
                              Appuyer pour révéler le verset {v.n}
                            </div>
                          ):(
                            <>
                              <TajwidSpan text={v.ar} enabled={showTj&&!!Q[selS.n]} tjc={tjc}/>
                              <span className="vmark"> ﴿{v.n}﴾</span>
                            </>
                          )}
                        </div>
                      </div>
                      {showTr&&v.fr&&(!reviewMode||isRevealed)&&<div className="vfr">{v.fr}</div>}
                      {showTf&&v.tf&&(!reviewMode||isRevealed)&&(
                        <div className="vtf">
                          <div className="vtf-hd">Tafsir Ibn Kathir</div>
                          {v.tf}
                        </div>
                      )}
                      <div className="vacts">
                        <button className={`vbtn ${isMem?"mem":""}`} onClick={()=>toggleV(selS.n,v.n)}>
                          {isMem?<><Icons.Check size={10}/>Mémorisé</>:<>+ Mémoriser</>}
                        </button>
                        <button className="vbtn snd" onClick={()=>{setLoopCurrent(1);doPlay(v.n);}}>
                          <Icons.Play size={10}/>{isPl?"Stop":"Écouter"}
                        </button>
                        <button className={`vbtn ${isFav(selS.n,v.n)?"mem":""}`}
                          onClick={()=>toggleFav(selS.n,v.n,v.ar,v.fr,selS.name)}>
                          <Icons.Heart size={10} filled={isFav(selS.n,v.n)}/>
                          {isFav(selS.n,v.n)?"Favori":"Favori"}
                        </button>
                        <button className={`vbtn ${notes[`${selS.n}_${v.n}`]?"on":""}`}
                          style={notes[`${selS.n}_${v.n}`]?{borderColor:t.pu,color:t.pu}:{}}
                          onClick={()=>{
                            setEditingNote(`${selS.n}_${v.n}`);
                            setNoteText(notes[`${selS.n}_${v.n}`]||"");
                          }}>
                          Note{notes[`${selS.n}_${v.n}`]?" ✓":""}
                        </button>
                        <button className="vbtn" onClick={()=>setShareVerse({sn:selS.n,vn:v.n,ar:v.ar,fr:v.fr,surah:selS.name,surahAr:selS.ar})}>
                          <Icons.Share size={10}/>Partager
                        </button>
                        {isMem&&(
                          <button className={`vbtn ${spacedDue.includes(`${selS.n}_${v.n}`)?"":"snd"}`}
                            style={spacedDue.includes(`${selS.n}_${v.n}`)?{borderColor:t.rd,color:t.rd}:{}}
                            onClick={()=>markSpaced(selS.n,v.n)}>
                            {spacedDue.includes(`${selS.n}_${v.n}`)?"Révision due":"Révisé"}
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      </div>
    )}

    {/* ── KHATMA ── */}
    {page==="khatma"&&(
      <div className="khatma-wrap">
        {/* Active khatma */}
        {activeKhatma&&(()=>{
          const k=activeKhatma;
          const days=getKhatmaDays(k);
          const doneDays=days.filter(d=>k.log[d]).length;
          const kpct=Math.round(doneDays/days.length*100);
          const streak=khatmaStreak(k);
          const todayStr=today();
          return (
            <div className="kh-active">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
                <div>
                  <div className="kh-title">{k.name}</div>
                  <div className="kh-sub">Khatma {k.preset} · {k.totalDays} jours · depuis le {k.startDate}</div>
                </div>
                <button className="tbtn" onClick={()=>setActiveKhatma(null)}>Changer</button>
              </div>
              <div className="kh-track">
                <div className="kh-fill" style={{width:`${kpct}%`}}/>
                <div className="kh-pct">{kpct}% — {doneDays}/{days.length} jours</div>
              </div>
              <div className="kh-stats">
                <div className="khs"><div className="streak-fire">{streak>0?"🔥":""}{streak}</div><div className="khs-l">Jours consécutifs</div></div>
                <div className="khs"><div className="khs-v">{doneDays}</div><div className="khs-l">Jours lus</div></div>
                <div className="khs"><div className="khs-v">{days.length-doneDays}</div><div className="khs-l">Jours restants</div></div>
              </div>
              {/* Calendar grid */}
              <div style={{marginTop:14}}>
                <div style={{fontSize:".65rem",color:t.tx3,marginBottom:6}}>Calendrier — cliquer pour cocher/décocher</div>
                <div className="kd-grid">
                  {days.map(d=>{
                    const done=k.log[d], isToday=d===todayStr;
                    const short=d.slice(8);
                    return (
                      <div key={d}
                        className={`kd-cell${done?" done":""}${isToday&&!done?" today":""}`}
                        onClick={()=>markKhatmaDay(k,d)}
                        title={d}>
                        {done?"✓":short}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          );
        })()}

        {/* Create new */}
        {!activeKhatma&&(
          <div className="card">
            <div className="ch"><span className="ct">Nouvelle Khatma</span></div>
            <div style={{padding:"16px",display:"flex",flexDirection:"column",gap:14}}>

              {/* Nom */}
              <div>
                <label style={{fontSize:".65rem",color:t.tx3,display:"block",marginBottom:6,textTransform:"uppercase",letterSpacing:"1px"}}>Nom de ta khatma</label>
                <input className="sinp" value={kName} onChange={e=>setKName(e.target.value)} placeholder="Ex: Ramadan 2025"/>
              </div>

              {/* Presets */}
              <div>
                <div style={{fontSize:".65rem",color:t.tx3,marginBottom:8,textTransform:"uppercase",letterSpacing:"1px"}}>Choisir un rythme</div>
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {KHATMA_PRESETS.map(p=>(
                    <div key={p.id}
                      onClick={()=>setKPreset(p)}
                      style={{
                        padding:"14px 16px",
                        borderRadius:12,
                        border:`2px solid ${kPreset?.id===p.id?t.acc:t.b1}`,
                        background:kPreset?.id===p.id?t.s3:t.s2,
                        cursor:"pointer",
                        display:"flex",alignItems:"center",gap:12,
                        transition:"all .15s",
                      }}>
                      <div style={{
                        width:40,height:40,borderRadius:10,
                        background:kPreset?.id===p.id?t.acc:t.b1,
                        display:"flex",alignItems:"center",justifyContent:"center",
                        fontSize:".85rem",fontWeight:700,color:kPreset?.id===p.id?"#fff":t.tx3,
                        flexShrink:0,
                      }}>
                        {p.id==="daily"?"1j":p.id==="weekly"?"7j":p.id==="monthly"?"30j":p.id==="ramadan"?"رمضان":"?"}
                      </div>
                      <div style={{flex:1}}>
                        <div style={{fontSize:".82rem",fontWeight:600,color:t.tx}}>{p.label}</div>
                        <div style={{fontSize:".62rem",color:t.tx3,marginTop:2}}>{p.desc}</div>
                      </div>
                      {kPreset?.id===p.id&&<Icons.Check size={16} color={t.acc}/>}
                    </div>
                  ))}
                </div>
              </div>

              {/* Custom days input */}
              {kPreset?.id==="custom"&&(
                <div>
                  <label style={{fontSize:".65rem",color:t.tx3,display:"block",marginBottom:6}}>Nombre de jours</label>
                  <input className="sinp" type="number" min="1" max="365" value={kCustomDays}
                    onChange={e=>setKCustomDays(e.target.value)}
                    style={{width:"100%"}}/>
                </div>
              )}

              {/* CTA button — full width, prominent */}
              <button
                onClick={createKhatma}
                disabled={!kPreset}
                style={{
                  width:"100%",
                  padding:"16px",
                  borderRadius:14,
                  border:"none",
                  background:kPreset?t.acc:t.b2,
                  color:kPreset?"#fff":t.tx3,
                  fontSize:".95rem",
                  fontWeight:700,
                  cursor:kPreset?"pointer":"not-allowed",
                  transition:"all .2s",
                  letterSpacing:".5px",
                }}>
                {kPreset?"Démarrer la Khatma":"Choisir un rythme d'abord"}
              </button>
            </div>
          </div>
        )}

        {/* Past khatmas */}
        {khatmas.length>0&&(
          <div className="card">
            <div className="ch"><span className="ct">Mes Khatmas</span></div>
            <div style={{display:"flex",flexDirection:"column"}}>
              {khatmas.map(k=>{
                const days=getKhatmaDays(k);
                const done=days.filter(d=>k.log[d]).length;
                const p=Math.round(done/days.length*100);
                return (
                  <div key={k.id} style={{padding:"10px 14px",borderBottom:`1px solid ${t.b1}`,display:"flex",alignItems:"center",gap:10,cursor:"pointer"}}
                    onClick={()=>setActiveKhatma(k)}>
                    <div style={{flex:1}}>
                      <div style={{fontSize:".78rem",fontWeight:600}}>{k.name}</div>
                      <div style={{fontSize:".6rem",color:t.tx3}}>{k.preset} · {done}/{days.length} jours</div>
                    </div>
                    <div style={{textAlign:"right"}}>
                      <div style={{fontSize:".85rem",fontWeight:700,color:t.acc}}>{p}%</div>
                      <div style={{width:60,height:4,background:t.b1,borderRadius:99,marginTop:3,overflow:"hidden"}}>
                        <div style={{height:"100%",background:t.acc,width:`${p}%`,borderRadius:99}}/>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>
    )}

    {/* ── STATS ── */}
    {page==="stats"&&(
      <div className="sp">
        <div className="sg">
          <div className="sc a"><div className="slbl">Progression</div><div className="sval">{pct}%</div><div className="ssub">{totalMem}/{TOTAL_VERSES}</div></div>
          <div className="sc g"><div className="slbl">Appris</div><div className="sval">{totalMem.toLocaleString()}</div><div className="ssub">versets</div></div>
          <div className="sc b"><div className="slbl">Rythme</div><div className="sval">{vpd}/j</div><div className="ssub">v/jour</div></div>
          <div className="sc r"><div className="slbl">Clôture</div><div className="sval">{daysLeft>0?`${daysLeft}j`:"🎉"}</div><div className="ssub">{eta}</div></div>
        </div>

        <div className="two-h">
          <div className="card">
            <div className="ch"><span className="ct">Vue globale</span></div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"18px 14px 12px"}}>
              <div className="donut-w">
                <svg width="150" height="150" viewBox="0 0 150 150">
                  <defs><linearGradient id="dg4" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stopColor={t.acc}/><stop offset="100%" stopColor={t.acc3}/>
                  </linearGradient></defs>
                  <circle cx="75" cy="75" r="55" fill="none" stroke={t.b1} strokeWidth="14"/>
                  <circle cx="75" cy="75" r="55" fill="none" stroke="url(#dg4)" strokeWidth="14"
                    strokeDasharray={`${2*Math.PI*55*pct/100} ${2*Math.PI*55*(1-pct/100)}`}
                    strokeLinecap="round" transform="rotate(-90 75 75)" style={{transition:"stroke-dasharray 1s ease"}}/>
                </svg>
                <div className="donut-c"><div className="d-pct">{pct}%</div><div className="d-lbl">mémorisé</div></div>
              </div>
              <div style={{width:"100%",marginTop:11,display:"flex",flexDirection:"column",gap:5}}>
                {[["✓ Complètes",SURAHS.filter(s=>sPct(s)===100).length,t.gr],
                  ["En cours",SURAHS.filter(s=>sPct(s)>0&&sPct(s)<100).length,t.acc],
                  ["Non commencées",SURAHS.filter(s=>sPct(s)===0).length,t.tx3]

            </div>
            <button className="mbtn" onClick={()=>{
              const txt=`بِسْمِ ٱللَّهِ\n\nMa progression Al-Hifz :\n${pct}% du Coran mémorisé\n${totalMem} / ${TOTAL_VERSES} versets\n${SURAHS.filter(s=>sPct(s)===100).length} sourates complètes\n\nBadges : ${badges.map(b=>BADGE_DEFS.find(x=>x.id===b)?.icon||"").join(" ")}\n\nAl-Hifz — Application de mémorisation du Coran`;
              navigator.clipboard?.writeText(txt).catch(()=>{});
            }}>Copier ma progression</button>
          </div>
        </div>

      </div>
    )}

    {/* ── SETTINGS ── */}
    {page==="settings"&&(
      <div className="settings-wrap">
        <div className="settings-section">
          <div className="ss-hd">Calligraphie arabe</div>
          <div className="font-grid">
            {FONTS.map(f=>(
              <div key={f.id} className={`font-card ${fontId===f.id?"sel":""}`} onClick={()=>setFontId(f.id)}>
                <div className="font-preview" style={{fontFamily:f.css}}>بِسْمِ ٱللَّهِ</div>
                <div className="font-name">{f.name}</div>
                <div className="font-desc">{f.desc}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="settings-section">
          <div className="ss-hd">Objectif de mémorisation</div>
          <div className="set-row">
            <div><div className="set-lbl">Versets par jour</div><div className="set-sub">Objectif quotidien de mémorisation</div></div>
            <input className="set-inp" type="number" min="1" max="100"
              defaultValue={settings?.dailyGoal||5}
              onChange={e=>setSettings(s=>({...s,dailyGoal:parseInt(e.target.value)||5}))}/>
          </div>
          <div className="set-row">
            <div><div className="set-lbl">Date de début</div><div className="set-sub">Pour le calcul du rythme réel</div></div>
            <input className="set-inp" type="date"
              defaultValue={settings?.startDate||today()}
              onChange={e=>setSettings(s=>({...s,startDate:e.target.value}))}/>
          </div>
        </div>

        <div className="settings-section">
          <div className="ss-hd">Thème & Affichage</div>
          <div className="set-row">
            <div><div className="set-lbl">Thème</div><div className="set-sub">Clair ou sombre</div></div>
            <button className="toggle on" style={{background:t.acc}} onClick={()=>setTn(n=>n==="dark"?"light":"dark")}/>
          </div>
          <div className="set-row">
            <div><div className="set-lbl">Mode nuit automatique</div><div className="set-sub">Sombre entre 20h et 7h</div></div>
            <button className={`toggle ${autoNight?"on":""}`} style={{background:autoNight?t.acc:t.b2}}
              onClick={()=>setAutoNight(v=>!v)}/>
          </div>
          <div className="set-row">
            <div><div className="set-lbl">Taille du texte arabe</div><div className="set-sub">Actuelle : {arabicSize.toFixed(1)}rem</div></div>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <button className="tbtn" onClick={()=>setArabicSize(s=>Math.max(1,+(s-0.1).toFixed(1)))}>A-</button>
              <span style={{fontSize:".75rem",color:t.acc,fontWeight:700,minWidth:30,textAlign:"center"}}>{arabicSize.toFixed(1)}</span>
              <button className="tbtn" onClick={()=>setArabicSize(s=>Math.min(3,+(s+0.1).toFixed(1)))}>A+</button>
            </div>
          </div>
        </div>

        <div className="settings-section">
          <div className="ss-hd">Répétition espacée</div>
          <div className="set-row">
            <div>
              <div className="set-lbl">Versets à réviser</div>
              <div className="set-sub">{spacedDue.length} verset(s) dû(s) aujourd'hui</div>
            </div>
            <button className="tbtn" style={{borderColor:t.acc,color:t.acc}}
              onClick={()=>setPage("stats")}>Voir →</button>
          </div>
          <div className="set-row">
            <div><div className="set-lbl">Réinitialiser révisions</div><div className="set-sub">Remet à zéro toutes les dates</div></div>
            <button className="tbtn" style={{borderColor:t.rd,color:t.rd}}
              onClick={()=>setSpaced({})}>Reset</button>
          </div>
        </div>

        <div className="settings-section">
          <div className="ss-hd">Badges ({badges.length}/{BADGE_DEFS.length})</div>
          <div style={{padding:12,display:"flex",gap:8,flexWrap:"wrap"}}>
            {BADGE_DEFS.map(b=>(
              <div key={b.id} style={{
                padding:"6px 10px",borderRadius:99,fontSize:".68rem",fontWeight:600,
                background:badges.includes(b.id)?t.acc:t.b1,
                color:badges.includes(b.id)?"#fff":t.tx3,
              }}>
                {b.icon} {b.label}
              </div>
            ))}
          </div>
        </div>

        <div className="settings-section">
          <div className="ss-hd">À propos</div>
          <div className="set-row"><div><div className="set-lbl">Al-Hifz</div><div className="set-sub">Application de mémorisation du Saint Coran · Version 6.0</div></div></div>
          <div className="set-row"><div><div className="set-lbl">Données embarquées</div><div className="set-sub">Al-Fatiha + Juz 30 complet (S.97–114) avec tafsir Ibn Kathir</div></div></div>
          <div className="set-row"><div><div className="set-lbl">Audio</div><div className="set-sub">5 récitateurs · répétition 1x–10x · cdn.islamic.network</div></div></div>
        </div>
      </div>
    )}
  </div>

  {/* ── Immersive mode ── */}
  {immersive&&selS&&verses.length>0&&(
    <div className="immersive">
      <div className="immersive-header">
        <div>
          <div className="immersive-title">{selS.ar}</div>
          <div style={{fontSize:".62rem",color:t.tx3}}>{selS.name} · {selS.v} versets</div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <button className="tbtn" style={{borderColor:t.acc,color:t.acc}}
            onClick={()=>setShowTr(v=>!v)}>{showTr?"Masquer trad.":"Afficher trad."}</button>
          <button className="tbtn" style={{borderColor:t.rd,color:t.rd}}
            onClick={()=>setImmersive(false)}>✕ Fermer</button>
        </div>
      </div>
      <div className="immersive-scroll"
        onTouchStart={handleTouchStart}
        onTouchEnd={handleTouchEnd}>
        {verses.map(v=>{
          const isMem=!!(mem[String(selS.n)]||{})[String(v.n)];
          return (
            <div key={v.n} className="immersive-verse"
              style={{borderBottom:`1px solid ${t.b1}`,opacity:isMem?1:0.7}}>
              <div className="immersive-ar" style={{fontSize:`${Math.max(arabicSize,1.8)}rem`}}>
                <TajwidSpan text={v.ar} enabled={showTj&&!!Q[selS.n]} tjc={tjc}/>
                <span style={{fontSize:"0.8rem",color:t.acc,marginRight:6,fontFamily:"'Amiri',serif"}}> ﴿{v.n}﴾</span>
              </div>
              {showTr&&v.fr&&<div className="immersive-fr">{v.fr}</div>}
              <div className="immersive-num" style={{display:"flex",gap:10,justifyContent:"center",marginTop:10}}>
                <button className={`vbtn ${isMem?"mem":""}`} onClick={()=>toggleV(selS.n,v.n)}>
                  {isMem?"✓ Mémorisé":"+ Mémoriser"}
                </button>
                <button className="vbtn snd" onClick={()=>doPlay(v.n)}>
                  <Icons.Play size={10}/> Écouter
                </button>
              </div>
            </div>
          );
        })}
      </div>
      {/* Immersive bottom nav */}
      <div style={{padding:"10px 16px",borderTop:`1px solid ${t.b1}`,display:"flex",justifyContent:"space-between",background:t.navBg,backdropFilter:"blur(16px)"}}>
        <button className="tbtn" onClick={()=>{const idx=SURAHS.findIndex(s=>s.n===selS.n);if(idx>0)doSelect(SURAHS[idx-1]);}}>← Sourate préc.</button>
        <span style={{fontSize:".7rem",color:t.tx3,display:"flex",alignItems:"center"}}>Swipe ← → pour naviguer</span>
        <button className="tbtn" onClick={()=>{const idx=SURAHS.findIndex(s=>s.n===selS.n);if(idx<SURAHS.length-1)doSelect(SURAHS[idx+1]);}}>Sourate suiv. →</button>
      </div>
    </div>
  )}

  {/* ── Bottom Navigation ── */}
  <nav className="bnav">
    {[
      ["quran",<Icons.Book size={22}/>, "Coran"],
      ["mushaf",<Icons.Star size={22}/>, "Mushaf"],
      ["pages",<Icons.List size={22}/>, "Pages"],
      ["khatma",<Icons.Scroll size={22}/>, "Khatma"],
      ["communaute",<Icons.Share size={22}/>, "Partage"],
      ["stats",<Icons.Chart size={22}/>, "Stats"],
      ["settings",<Icons.Settings size={22}/>, "Réglages"],
    ].map(([id,icon,label])=>(
      <button key={id} className={`bn ${page===id?"on":""}`} onClick={()=>setPage(id)}>
        {icon}
        <span className="bn-lbl">{label}</span>
      </button>
    ))}
  </nav>

  <audio ref={audioRef} style={{display:"none"}}
    onError={()=>setPlaying(null)}/>
</>
);
}
const root = ReactDOM.createRoot(document.getElementById(‘root’));
root.render(<App />);
</script>

</body>
</html>
